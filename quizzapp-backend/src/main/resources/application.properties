spring.application.name=quizzapp-backend

spring.jpa.hibernate.ddl-auto=create
spring.jpa.database=postgresql
spring.datasource.username=quizzapp-user
spring.datasource.password=quizzapp-password
#erstellen einer eigenen URL
spring.datasource.url=jdbc:postgresql://localhost:5433/quizzapp
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8181
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
